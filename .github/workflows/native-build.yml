name: native-build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: node bin/ares.mjs setup
      - run: node bin/astra-ares.mjs --version
      - uses: oven-sh/setup-bun@v2
      - run: |
          JEV_TEST_BINARY="$(node -e 'import("./src/config.mjs").then((m) => console.log(m.locations().binary))')"
          export JEV_TEST_BINARY
          npm run test:native
